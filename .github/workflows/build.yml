name: Build firmware

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-keymap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      regenerated: ${{ steps.generate.outputs.regenerated }}
    steps:
      - uses: actions/checkout@v6
      - name: Regenerate Sweep map and diagrams
        id: generate
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/generate_universal_34_keys.py
          git add -- config/cradio.keymap 'docs/keymap/*.svg'
          if git diff --cached --quiet; then
            echo "regenerated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT" != push ]; then
            echo "::error::Generated files are stale. Regenerate and push before building this ref."
            exit 1
          fi

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Regenerate 34-key keymap and diagrams'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "regenerated=true" >> "$GITHUB_OUTPUT"
          # Pushes made with GITHUB_TOKEN do not trigger a new push workflow.
          gh workflow run build.yml --ref "$BRANCH"

  build:
    needs: sync-keymap
    if: needs.sync-keymap.outputs.regenerated != 'true'
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
