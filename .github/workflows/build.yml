name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync-keymap:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      regenerated: ${{ steps.generate.outputs.regenerated }}
    steps:
      - uses: actions/checkout@v6
      - name: Regenerate Sweep map and diagrams
        id: generate
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/generate_universal_34_keys.py
          git add -- config/cradio.keymap 'docs/keymap/*.svg'
          if git diff --cached --quiet; then
            echo "regenerated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Regenerate 34-key keymap and diagrams'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "regenerated=true" >> "$GITHUB_OUTPUT"
          # Pushes made with GITHUB_TOKEN do not trigger a new push workflow.
          gh workflow run build.yml --ref "$BRANCH"

  check-keymap:
    needs: sync-keymap
    if: >-
      ${{ !cancelled() && (needs.sync-keymap.result == 'skipped' ||
      (needs.sync-keymap.result == 'success' && needs.sync-keymap.outputs.regenerated == 'false')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/generate_universal_34_keys.py --check

  build:
    needs: check-keymap
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: firmware
          path: firmware
      - name: Attach UF2 files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload -- "$RELEASE_TAG" firmware/*.uf2
